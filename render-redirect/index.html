<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TuskerLabs has moved</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border: 1px solid #d9d9d9;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 58px;
            line-height: 1;
            margin-bottom: 24px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 14px 26px;
            font-weight: 600;
            transition: .2s;
        }

        .button:hover {
            background: #000;
        }

        .small {
            margin-top: 28px;
            color: #999;
            font-size: 14px;
        }

        #countdown {
            color: #111;
            font-weight: 600;
        }

        @media (max-width:640px) {

            h1 {
                font-size: 40px;
            }

            p {
                font-size: 16px;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">
            Official Website Update
        </div>

        <h1>
            TuskerLabs has moved.
        </h1>

        <p>
            Our official website is now available on our permanent domain.
            You'll be redirected automatically in a few seconds.
        </p>

        <a class="button" href="https://tuskerlabs.com">
            Visit tuskerlabs.com →
        </a>

        <div class="small">
            Redirecting in <span id="countdown">5</span> seconds...
        </div>

    </div>

    <script>
        const TARGET = "https://tuskerlabs.com";

        let seconds = 5;

        const countdown = document.getElementById("countdown");
        const status = document.querySelector(".small");

        const timer = setInterval(() => {

            seconds--;

            if (seconds > 0) {
                countdown.textContent = seconds;
            } else {
                clearInterval(timer);

                status.textContent = "Opening TuskerLabs...";

                setTimeout(() => {
                    window.location.replace(TARGET);
                }, 300);
            }

        }, 1000);
    </script>

</body>

</html>
