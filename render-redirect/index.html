<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TuskerLabs has moved</title>

<meta http-equiv="refresh" content="5;url=https://tuskerlabs.com">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#ffffff;
    color:#111111;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:32px;
}

.container{
    max-width:700px;
    width:100%;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border:1px solid #ddd;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:28px;
}

h1{
    font-size:56px;
    line-height:1;
    font-weight:700;
    margin-bottom:20px;
}

p{
    color:#666;
    font-size:18px;
    line-height:1.7;
    margin-bottom:36px;
}

a.button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:14px 24px;
    background:#111;
    color:white;
    text-decoration:none;
    font-weight:600;
}

a.button:hover{
    background:#000;
}

.small{
    margin-top:28px;
    font-size:14px;
    color:#999;
}

.small a{
    color:#111;
}

@media(max-width:640px){

h1{
    font-size:38px;
}

p{
    font-size:16px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="badge">
Official Update
</div>

<h1>
TuskerLabs has moved.
</h1>

<p>
Our official website is now available on our permanent domain.
You'll be redirected automatically in a few seconds.
</p>

<a class="button" href="https://tuskerlabs.com">
Visit tuskerlabs.com →
</a>

<div class="small">
Redirecting in 5 seconds...
</div>

</div>

</body>
</html>
